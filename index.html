<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Node | Feedback Protocol</title>
      <link rel="icon" type="image/png" href="/fevicon.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- NEUMORPHIC VARIABLES --- */
        :root {
            /* Light Mode (Default) */
            --bg-color: #e0e5ec;
            --text-main: #4a5568;
            --text-muted: #718096;
            --accent: #667eea; /* Soft Blue/Purple */
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --input-bg: #e0e5ec;
            --border-radius: 20px;
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            /* Dark Mode */
            --bg-color: #000000; /* Deep dark blue-grey */
            --text-main: #c0caf5;
            --text-muted: #7aa2f7;
            --accent: #bb9af7; /* Neon Purple */
            --shadow-light: #292e42; /* Lighter than bg */
            --shadow-dark: #13141c; /* Darker than bg */
            --input-bg: #1a1b26;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: var(--transition);
        }

        /* --- LAYOUT --- */
        .container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .neumorphic-card {
            background: var(--bg-color);
            border-radius: 30px;
            padding: 40px;
            /* The Neumorphic Shadow Magic */
            box-shadow: 
                9px 9px 16px var(--shadow-dark), 
                -9px -9px 16px var(--shadow-light);
            transition: var(--transition);
        }

        /* --- HEADER & TOGGLE --- */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            letter-spacing: -0.5px;
        }

        /* Theme Toggle Switch */
        .theme-switch-wrapper {
            display: flex;
            align-items: center;
        }
        
        .theme-switch {
            display: inline-block;
            height: 34px;
            position: relative;
            width: 60px;
        }

        .theme-switch input { display:none; }

        .slider {
            background-color: var(--bg-color);
            bottom: 0;
            cursor: pointer;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            transition: .4s;
            border-radius: 34px;
            box-shadow: 
                inset 2px 2px 5px var(--shadow-dark), 
                inset -2px -2px 5px var(--shadow-light);
        }

        .slider:before {
            background-color: var(--accent);
            bottom: 4px;
            content: "";
            height: 26px;
            left: 4px;
            position: absolute;
            transition: .4s;
            width: 26px;
            border-radius: 50%;
            box-shadow: 2px 2px 5px var(--shadow-dark);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* --- FORM ELEMENTS --- */
        .form-group { margin-bottom: 25px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        /* Neumorphic Inputs (Inset) */
        input[type="text"], 
        input[type="email"], 
        textarea, 
        select {
            width: 100%;
            background: var(--input-bg);
            border: none;
            padding: 15px 20px;
            font-size: 15px;
            color: var(--text-main);
            border-radius: 15px;
            /* Inset Shadow for "Pressed" look */
            box-shadow: 
                inset 5px 5px 10px var(--shadow-dark), 
                inset -5px -5px 10px var(--shadow-light);
            transition: var(--transition);
            outline: none;
        }

        textarea { resize: vertical; min-height: 120px; }

        input:focus, textarea:focus {
            box-shadow: 
                inset 2px 2px 5px var(--shadow-dark), 
                inset -2px -2px 5px var(--shadow-light),
                0 0 0 2px var(--accent); /* Focus ring */
        }

        /* Star Rating */
        .stars {
            display: flex;
            gap: 15px;
            font-size: 24px;
            cursor: pointer;
            margin-top: 5px;
        }
        .star { color: var(--shadow-dark); transition: 0.2s; }
        .star.active { color: var(--accent); text-shadow: 0 0 10px var(--accent); }

        /* --- SECURE CONTACT SECTION --- */
        .secure-contact {
            margin-top: 30px;
            padding: 20px;
            border-radius: 20px;
            background: var(--bg-color);
            /* Subtle raised effect */
            box-shadow: 
                5px 5px 10px var(--shadow-dark), 
                -5px -5px 10px var(--shadow-light);
            text-align: center;
        }

        .secure-contact p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .contact-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-color);
            color: var(--accent);
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            /* Raised Button */
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .contact-btn:hover {
            transform: translateY(-2px);
            color: var(--text-main);
            border-color: var(--accent);
        }

        .contact-btn:active {
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
            transform: translateY(0);
        }

        /* --- SUBMIT BUTTON --- */
        .submit-btn {
            width: 100%;
            margin-top: 10px;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: var(--bg-color);
            color: var(--accent);
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            color: var(--bg-color);
            background: var(--accent);
            box-shadow: 
                0 0 15px var(--accent); /* Glow */
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* --- AI BOT PLACEHOLDER --- */
        .ai-status {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.7;
        }
        .ai-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 5px;
            box-shadow: 0 0 5px #10b981;
        }

        @media (max-width: 600px) {
            .neumorphic-card { padding: 25px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="neumorphic-card">
            
            <!-- Header with Theme Toggle -->
            <div class="header-row">
                <h1>Feedback Protocol</h1>
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="checkbox">
                        <input type="checkbox" id="checkbox" />
                        <div class="slider"></div>
                    </label>
                </div>
            </div>

            <form id="feedbackForm">
                <!-- Web3Forms Hidden Fields -->
                <input type="hidden" name="access_key" value="cad2cc4f-bbbf-4286-86fd-9b4ff6651c0d">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <!-- Star Rating -->
                <div class="form-group">
                    <label>Rate Experience</label>
                    <div class="stars" id="starContainer">
                        <i class="fas fa-star star" data-value="1"></i>
                        <i class="fas fa-star star" data-value="2"></i>
                        <i class="fas fa-star star" data-value="3"></i>
                        <i class="fas fa-star star" data-value="4"></i>
                        <i class="fas fa-star star" data-value="5"></i>
                    </div>
                    <input type="hidden" name="Rating_Score" id="ratingInput" required>
                </div>

                <!-- Text Feedback -->
                <div class="form-group">
                    <label for="thoughts">Your Thoughts</label>
                    <textarea id="thoughts" name="User_Thoughts" placeholder="Describe your experience..." required></textarea>
                </div>

                <!-- Optional Contact (For follow up) -->
                <div class="form-group">
                    <label for="userEmail">Your Email (Optional)</label>
                    <input type="email" id="userEmail" name="User_Email" placeholder="If you want a reply...">
                </div>

                <!-- Secure Contact Section (Replaces Image Upload) -->
                <div class="secure-contact">
                    <p>Need to share screenshots or sensitive logs?<br>Use our secure external channel.</p>
                    <!-- The JS will assemble this link to hide the email from scrapers -->
                    <a href="E_MAIL" id="secureLink" class="contact-btn">
                        <i class="fas fa-shield-alt"></i> Open Secure Channel
                    </a>
                </div>

                <button type="submit" id="executeBtn" class="submit-btn" disabled>
                    <span>Transmit Report</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

        </div>
    </div>

    <script>
        // --- 1. THEME TOGGLE LOGIC ---
        const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
        const currentTheme = localStorage.getItem('theme');

        if (currentTheme) {
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (currentTheme === 'dark') {
                toggleSwitch.checked = true;
            }
        }

        function switchTheme(e) {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
            }
        }
        toggleSwitch.addEventListener('change', switchTheme, false);

        // --- 2. EMAIL OBFUSCATION (SECURITY) ---
        // We construct the email dynamically so bots can't scrape it easily.
        // REPLACE 'your-username' and 'domain.com' below.
        const secureLink = document.getElementById('secureLink');
        
        secureLink.addEventListener('click', (e) => {
            e.preventDefault();
            const user = "support"; // Change this
            const domain = "gs-softwares.pages.dev"; // Change this to your actual domain/email domain
            const subject = encodeURIComponent("Feedback / Screenshot Submission");
            const body = encodeURIComponent("Hi,\n\nI am attaching screenshots regarding...\n\n[Attach files here]");
            
            window.location.href = `mailto:${user}@${domain}?subject=${subject}&body=${body}`;
        });

        // --- 3. STAR RATING LOGIC ---
        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('ratingInput');
        const executeBtn = document.getElementById('executeBtn');
        const thoughts = document.getElementById('thoughts');

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const val = star.getAttribute('data-value');
                ratingInput.value = val;
                updateStars(val);
                validateForm();
            });
        });

        function updateStars(value) {
            stars.forEach(s => {
                const sVal = parseInt(s.getAttribute('data-value'));
                if (sVal <= parseInt(value)) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        // --- 4. FORM VALIDATION & SUBMISSION ---
        function validateForm() {
            const hasRating = ratingInput.value !== '';
            const hasThoughts = thoughts.value.trim().length > 0;
            executeBtn.disabled = !(hasRating && hasThoughts);
        }

        thoughts.addEventListener('input', validateForm);

        // AJAX Submission (No Redirect)
        document.getElementById('feedbackForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('executeBtn');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Transmitting...';

            const formData = new FormData(this);
            
            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.status === 200) {
                    btn.style.background = '#10b981'; // Success Green
                    btn.style.color = '#fff';
                    btn.innerHTML = '<i class="fas fa-check"></i> Received';
                    this.reset();
                    updateStars(0);
                    setTimeout(() => {
                        btn.style.background = '';
                        btn.style.color = '';
                        btn.innerHTML = originalText;
                        btn.disabled = true;
                    }, 3000);
                } else {
                    alert('Error: ' + result.message);
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                console.error(error);
                alert('Network Error. Please try again.');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
